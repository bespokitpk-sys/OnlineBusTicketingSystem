<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Receipt - Book smarter, travel better</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f7fa; padding: 30px; }
        
        .receipt-container {
            max-width: 1000px;
            margin: 30px auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        .receipt-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 40px;
            align-items: center;
        }
        
        .receipt-details {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .receipt-details h2 {
            font-size: 1.8rem;
            color: #0f1c33;
            margin-bottom: 15px;
            font-weight: 700;
            border-bottom: 3px solid #0072ff;
            padding-bottom: 10px;
        }
        
        .receipt-details p {
            font-size: 1rem;
            color: #333;
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        
        .receipt-details strong {
            color: #0f1c33;
            font-weight: 700;
            min-width: 150px;
        }
        
        .receipt-qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            border: 2px dashed #0072ff;
            padding: 30px;
            border-radius: 8px;
            background: #f8f9fa;
        }
        
        .receipt-qr-section img {
            width: 280px;
            height: 280px;
            border: 3px solid #0072ff;
            border-radius: 8px;
            padding: 10px;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 114, 255, 0.2);
        }
        
        .qr-label {
            font-weight: 700;
            color: #0f1c33;
            font-size: 1.1rem;
            text-align: center;
        }
        
        .qr-instruction {
            font-size: 0.9rem;
            color: #666;
            text-align: center;
            font-style: italic;
        }
        
        .receipt-actions {
            padding: 20px 40px 40px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .receipt-actions a {
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .receipt-actions a.pdf {
            background: #0072ff;
            color: white;
        }
        
        .receipt-actions a.pdf:hover {
            background: #0056cc;
            box-shadow: 0 4px 12px rgba(0, 114, 255, 0.3);
            transform: translateY(-2px);
        }
        
        .receipt-actions a.print {
            background: #28a745;
            color: white;
        }
        
        .receipt-actions a.print:hover {
            background: #218838;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
            transform: translateY(-2px);
        }
        
        .receipt-actions a.back {
            background: #6c757d;
            color: white;
        }
        
        .receipt-actions a.back:hover {
            background: #5a6268;
            box-shadow: 0 4px 12px rgba(108, 117, 125, 0.3);
            transform: translateY(-2px);
        }
        
        @media (max-width: 768px) {
            .receipt-content {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 20px;
            }
            
            .receipt-details h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
<div class="receipt-container">
    <div class="receipt-content">
        <!-- Left Side: Receipt Details -->
        <div class="receipt-details">
            <h2>📋 Booking Receipt</h2>
            <p><strong>Ticket ID:</strong> <span>9</span></p>
            <p><strong>Bus:</strong> <span>Lahore Flyer</span></p>
            <p><strong>Route:</strong> <span>Lahore → Karachi</span></p>
            <p><strong>Date:</strong> <span>2026-05-05 10:00</span></p>
            <p><strong>Seats:</strong> <span>2</span></p>
            <p><strong>Status:</strong> <span>Pending</span></p>
            <p><strong>Payment Method:</strong> <span>Cash paid to operator</span></p>
        </div>
        
        <!-- Right Side: QR Code -->
        <div class="receipt-qr-section">
            <div class="qr-label">🔲 Ticket QR Code</div>
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=http%3A%2F%2Fbusticketingsystem.test%2Fpublic%2Fverify_ticket.php%3Fticket_id%3D9%26code%3DTICKET-9" alt="Ticket QR Code" title="Scan this QR code to verify ticket and show passenger details">
            <div class="qr-instruction">Show this QR code to the operator for payment confirmation.</div>
        </div>
    </div>
    
    <!-- Action Buttons -->
    <div class="receipt-actions">
        <a href="#" class="pdf">📥 Download PDF</a>
        <a href="#" class="print">🖨️ Print Ticket</a>
        <a href="#" class="back">← Back to My Tickets</a>
    </div>
</div>
</body>
</html>
